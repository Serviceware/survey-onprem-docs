name: SurveyExporter build

on:
  pull_request:
    paths:
      - 'SurveyExporter/**'
      - '.github/workflows/survey-exporter-*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SurveyExporter/SurveyExporter.sln -c Release
